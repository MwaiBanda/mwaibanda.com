name: Build and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_API_URL: ${{ github.ref == 'refs/heads/staging' && (vars.STAGING_CONTENT_API_URL || 'https://staging.mwaibanda.com') || (vars.PRODUCTION_CONTENT_API_URL || vars.CONTENT_API_URL || 'https://mwaibanda.com') }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level high
      - run: pnpm release
      - run: node --test scripts/deploy.test.mjs
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: frontend/dist
          include-hidden-files: true
  container:
    needs: frontend
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      environment: ${{ steps.image.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Select immutable image and environment
        id: image
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) branch=main; environment=production ;;
            refs/heads/staging) branch=staging; environment=staging ;;
            *) branch=check; environment=none ;;
          esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$branch-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            CONTENT_API_URL=${{ env.CONTENT_API_URL }}
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && steps.image.outputs.environment != 'none'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name == 'push' && steps.image.outputs.environment != 'none'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"
  deploy:
    needs: container
    if: github.event_name == 'push' && needs.container.outputs.environment != 'none' && vars.HOME_SERVER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.container.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.container.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'mwais-macbook.tail27a672.ts.net' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'mwaibanda' }}
      DEPLOY_ENVIRONMENT: ${{ needs.container.outputs.environment }}
      DEPLOY_IMAGE: ${{ needs.container.outputs.image }}
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}
      - name: Deploy through restricted SSH command
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/mwaibanda-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mwaibanda-deploy" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -i "$HOME/.ssh/mwaibanda-deploy" \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_ENVIRONMENT $DEPLOY_IMAGE"