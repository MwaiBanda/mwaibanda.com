name: Build and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_API_URL: ${{ github.ref == 'refs/heads/staging' && (vars.STAGING_CONTENT_API_URL || 'https://staging.mwaibanda.com') || (vars.PRODUCTION_CONTENT_API_URL || vars.CONTENT_API_URL || 'https://mwaibanda.com') }}

jobs:
  content-snapshot:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'mwais-macbook.tail27a672.ts.net' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'mwaibanda' }}
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}
      - name: Fetch private content snapshot
        env:
          CONTENT_SSH_KEY: ${{ secrets.CONTENT_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$CONTENT_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh" content
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$CONTENT_SSH_KEY" > "$HOME/.ssh/mwaibanda-content"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mwaibanda-content" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -i "$HOME/.ssh/mwaibanda-content" \
            "$DEPLOY_USER@$DEPLOY_HOST" content > content/content.json
          test -s content/content.json
      - uses: actions/upload-artifact@v4
        with:
          name: content-snapshot
          path: content/content.json
          if-no-files-found: error
  frontend:
    needs: content-snapshot
    if: ${{ !cancelled() && (needs.content-snapshot.result == 'success' || needs.content-snapshot.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level high
      - uses: actions/download-artifact@v4
        if: needs.content-snapshot.result == 'success'
        with:
          name: content-snapshot
          path: frontend/.release
      - name: Use test content for non-release builds
        if: needs.content-snapshot.result == 'skipped'
        run: |
          mkdir -p .release
          cp scripts/test-content.json .release/content.json
      - run: pnpm release
        env:
          CONTENT_SNAPSHOT_PATH: .release/content.json
      - run: node --test scripts/deploy.test.mjs
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: build-content
          path: frontend/.release/content.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: frontend/dist
          include-hidden-files: true
  container:
    needs: frontend
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      environment: ${{ steps.image.outputs.environment }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-content
          path: frontend/.release
      - name: Select immutable image and environment
        id: image
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) branch=main; environment=production ;;
            refs/heads/staging) branch=staging; environment=staging ;;
            *) branch=check; environment=none ;;
          esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$branch-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            CONTENT_API_URL=${{ env.CONTENT_API_URL }}
            CONTENT_SNAPSHOT_PATH=.release/content.json
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && steps.image.outputs.environment != 'none'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        id: publish
        if: github.event_name == 'push' && steps.image.outputs.environment != 'none'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          ENVIRONMENT: ${{ steps.image.outputs.environment }}
        run: |
          if ! push_output="$(docker push "$IMAGE" 2>&1)"; then
            printf '%s\n' "$push_output" >&2
            exit 1
          fi
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '$2 == "digest:" { digest=$3 } END { print digest }')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'Could not capture the pushed image digest\n' >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        shell: bash
  sign_release:
    needs: container
    if: github.event_name == 'push' && needs.container.outputs.environment != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.signed.outputs.image }}
    steps:
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: 'v2.4.1'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign release image digest
        id: signed
        env:
          IMAGE: ${{ needs.container.outputs.image }}
          DIGEST: ${{ needs.container.outputs.digest }}
          ENVIRONMENT: ${{ needs.container.outputs.environment }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'Missing or invalid release image digest\n' >&2
            exit 1
          fi
          case "$ENVIRONMENT" in
            staging|production) ;;
            *) printf 'Unsupported signing environment\n' >&2; exit 1 ;;
          esac
          repository="${IMAGE%:*}"
          cosign sign --yes "$repository@$DIGEST"
          echo "image=$repository@$DIGEST" >> "$GITHUB_OUTPUT"
        shell: bash
  deploy:
    needs: [container, sign_release]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.container.result == 'success' && needs.sign_release.result == 'success' && ((needs.container.outputs.environment == 'staging' && vars.STAGING_DEPLOY_ENABLED == 'true') || (needs.container.outputs.environment == 'production' && vars.HOME_SERVER_DEPLOY_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.container.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.container.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'mwais-macbook.tail27a672.ts.net' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'mwaibanda' }}
      DEPLOY_ENVIRONMENT: ${{ needs.container.outputs.environment }}
      DEPLOY_IMAGE: ${{ needs.sign_release.outputs.image }}
      DEPLOY_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}
      - name: Deploy through restricted SSH command
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/mwaibanda-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mwaibanda-deploy" "$HOME/.ssh/known_hosts"
          ssh_options=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -i "$HOME/.ssh/mwaibanda-deploy")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $DEPLOY_ENVIRONMENT $DEPLOY_IMAGE $DEPLOY_RELEASE_SHA"